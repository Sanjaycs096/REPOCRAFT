name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Quality Checks (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (Ubuntu) matrix: explicit ubuntu-22.04 for Python 3.9 (Ubuntu 26.04 toolcache lacks Python 3.9), ubuntu-latest for 3.10-3.12
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          # Windows matrix
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.12"

    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Python syntax and compilation check
        run: |
          python -m compileall -q skill/ install.py tests/

      - name: Run installer contract tests
        run: |
          pytest -v tests/test_installer_contract.py

      - name: Run Phase 1-5 test suites
        run: |
          pytest -v tests/test_repository_intelligence.py
          pytest -v tests/test_maintenance_engine.py
          pytest -v tests/test_security_engine.py
          pytest -v tests/test_repair_engine.py
          pytest -v tests/test_git_engine.py

      - name: Run Phase 6 integration test suite
        run: |
          pytest -v tests/integration/

      - name: Run Phase 7 distribution test suite
        run: |
          pytest -v tests/distribution/

      - name: Verify release distribution package integrity
        run: |
          python skill/scripts/repocraft_release.py verify-distribution

